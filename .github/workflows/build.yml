name: Build M32 X32 OpenWrt
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl libelf-dev device-tree-compiler
      - name: Fetch pinned OpenWrt 25.12.5 and adapt
        run: |
          git clone --depth 1 --branch v25.12.5 https://github.com/openwrt/openwrt.git openwrt
          test "$(git -C openwrt rev-parse HEAD)" = f0a60eee2fe051741c643ea6118718aae1ef17fb
          python3 scripts/adapt.py openwrt
          mkdir -p output
          git -C openwrt diff > output/m32-adaptation.patch
          cp openwrt/target/linux/mediatek/dts/mt7622-ruijie-rg-ew3200gx-pro.dts output/m32-x32.dts
      - name: Configure
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../build.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_mt7622_DEVICE_ruijie_rg-ew3200gx-pro=y$' .config
          cp .config ../output/build.config
          ./scripts/diffconfig.sh > ../output/diffconfig
          git rev-parse HEAD > ../output/source-commit.txt
          ./scripts/feeds list -s > ../output/feeds.txt
      - name: Download sources
        working-directory: openwrt
        run: make download -j8
      - name: Compile firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee ../build.log
      - name: Verify and collect firmware
        run: |
          python3 scripts/verify.py openwrt output
          cp README.md output/README.md
          cd output
          sha256sum *.bin > SHA256SUMS
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-ruijie-m32-x32-experimental
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            output/
          retention-days: 14
